name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Pin a supported patch release: go.mod only carries the *minimum*
          # language version, and Go 1.24.0 shipped an arm64 compiler bug
          # (golang/go#71938, fixed in 1.24.1) that corrupts the heap.
          go-version: "1.27.4"
          cache: true
      - run: go test ./...
      - run: make build
  windows-test:
    runs-on: windows-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Pin a supported patch release: go.mod only carries the *minimum*
          # language version, and Go 1.24.0 shipped an arm64 compiler bug
          # (golang/go#71938, fixed in 1.24.1) that corrupts the heap.
          go-version: "1.27.4"
          cache: true
      - uses: msys2/setup-msys2@v2
        with:
          update: true
          install: mingw-w64-x86_64-gcc
      - name: Add MSYS2 to PATH
        shell: pwsh
        run: echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: go test ./...
